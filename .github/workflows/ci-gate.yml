name: ci-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-gate:
    runs-on: bp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: jest
        run: npm test
